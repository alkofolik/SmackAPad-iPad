<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Plná verze</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;color:#1F1D1A}
.ic{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bn{display:flex;gap:18px;align-items:flex-start}
.bi{width:52px;height:52px;border-radius:14px;background:#EBE5DA;display:flex;align-items:center;justify-content:center;flex:none}
.bt{font:600 20px/1.3 'IBM Plex Sans'}
.bt small{display:block;font:500 15px/1.4 'IBM Plex Sans';color:#5E5950;margin-top:2px}
</style>
</helmet>
<div style="width:1194px;height:834px;background:#F4EFE6;position:relative;overflow:hidden">
  <section style="position:absolute;left:24px;top:24px;bottom:24px;width:500px;border-radius:24px;background:#1F1D1A;color:#F4EFE6;padding:40px;box-sizing:border-box;display:flex;flex-direction:column">
    <button aria-label="Zpět" style="width:56px;height:56px;border:0;background:rgba(244,239,230,.12);color:#F4EFE6;border-radius:14px;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div aria-hidden="true" style="margin-top:auto;width:120px;height:120px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div style="background:#F4EFE6;border-radius:6px"></div>
      <div style="background:#FF6B00;border-radius:6px;transform:rotate(8deg)"></div>
      <div style="background:#F4EFE6;border-radius:6px"></div>
      <div style="background:#F4EFE6;border-radius:6px"></div>
    </div>
    <div style="margin-top:32px;font:800 76px/0.92 'Barlow Condensed'">PLNÁ<br>VERZE</div>
    <div style="margin-top:20px;display:flex;align-items:baseline;gap:10px"><span style="font:700 44px 'IBM Plex Sans';color:#FF6B00">529</span><span style="font:500 20px 'IBM Plex Sans';color:#B3ADA2">lekcí navíc</span></div>
  </section>

  <section style="position:absolute;left:584px;right:64px;top:120px;display:flex;flex-direction:column;gap:30px">
    <div class="bn"><span class="bi"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="12" y="4" width="4" height="16" rx="1"/><path d="M18 5l3 14"/></svg></span><span class="bt">Celá knihovna<small>všechny úrovně Cesty a 43 lekcí napříč žánry</small></span></div>
    <div class="bn"><span class="bi"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></span><span class="bt">Jednorázová platba<small>bez předplatného</small></span></div>
    <div class="bn"><span class="bi"><svg class="ic" viewBox="0 0 24 24"><polygon points="12 3 14.8 9 21 9.6 16.3 13.8 17.7 20 12 16.8 6.3 20 7.7 13.8 3 9.6 9.2 9"/></svg></span><span class="bt">Postup podle hvězd<small>další stupně se odemykají, jak sbíráš hvězdy</small></span></div>
  </section>

  <div style="position:absolute;left:584px;right:64px;bottom:64px;display:flex;flex-direction:column;gap:14px">
    <sc-if value="{{notBought}}" hint-placeholder-val="{{true}}">
      <button style="height:80px;border:0;border-radius:16px;background:#FF6B00;font:700 24px 'IBM Plex Sans';color:#1F1D1A">Odemknout za [CENA]</button>
      <button style="height:52px;border:1.5px solid rgba(31,29,26,.28);border-radius:14px;background:#EBE5DA;font:600 17px 'IBM Plex Sans';color:#1F1D1A">Obnovit nákup</button>
    </sc-if>
    <sc-if value="{{bought}}" hint-placeholder-val="{{false}}">
      <div style="height:80px;border-radius:16px;background:#1F1D1A;color:#F4EFE6;display:flex;align-items:center;justify-content:center;gap:12px;font:700 24px 'IBM Plex Sans'"><svg class="ic" viewBox="0 0 24 24" style="color:#FF6B00;stroke-width:3"><path d="M5 12l5 5 9-10"/></svg>Zakoupeno</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"purchased":{"editor":"boolean","default":false},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const b = this.props.purchased ?? false;
    return { bought: b, notBought: !b };
  }
}
</script>
</body>
</html>
