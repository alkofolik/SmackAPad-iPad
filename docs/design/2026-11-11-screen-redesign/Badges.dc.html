<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Odznaky</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;color:#1F1D1A}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.m{width:128px;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;padding:0;color:#1F1D1A}
.ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.in{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nm{font:600 14px/1.25 'IBM Plex Sans';text-align:center;height:36px}
.dt{font:500 12px 'IBM Plex Sans';color:#5E5950;height:16px}
</style>
</helmet>
<div style="width:1194px;height:834px;background:#F4EFE6;position:relative;overflow:hidden">
  <div style="position:absolute;left:24px;right:24px;top:24px;height:56px;display:flex;align-items:center;gap:20px">
    <button aria-label="Zpět" style="width:56px;height:56px;border:0;background:#E6DFD2;border-radius:14px;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="font:700 28px 'IBM Plex Sans';flex:1">Odznaky</div>
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:220px;height:8px;border-radius:4px;background:#DDD5C8"><div style="width:25%;height:8px;border-radius:4px;background:#FF6B00"></div></div>
      <span style="font:700 20px 'IBM Plex Sans'">14 <span style="color:#5E5950;font-weight:500">/ 55</span></span>
    </div>
  </div>

  <div style="position:absolute;left:24px;right:24px;top:108px;display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
      <section style="border-radius:20px;background:#EBE5DA;padding:18px 20px 14px">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px">
          <h2 style="margin:0;font:600 19px 'IBM Plex Sans'">{{c.title}}</h2>
          <span style="font:500 15px 'IBM Plex Sans';color:#5E5950">{{c.count}}</span>
        </div>
        <div style="display:flex;gap:10px">
          <sc-for list="{{c.items}}" as="b" hint-placeholder-count="7">
            <button class="m" aria-label="{{b.name}}">
              <div class="ring" style="background:{{b.ring}}">
                <div class="in" style="background:{{b.bg}};color:{{b.fg}}">
                  <sc-if value="{{c.lesson}}" hint-placeholder-val="{{true}}"><svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="3" style="fill:currentColor"/></svg></sc-if>
                  <sc-if value="{{c.tempo}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M9 3h6l4 18H5z"/><path d="M12 15l5-8"/></svg></sc-if>
                  <sc-if value="{{c.train}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg></sc-if>
                </div>
              </div>
              <div class="nm">{{b.name}}</div>
              <div class="dt">{{b.sub}}</div>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (list) => list.map(([name, p]) => p >= 100
      ? { name, sub: '11. 11.', ring: '#1F1D1A', bg: '#FF6B00', fg: '#1F1D1A' }
      : { name, sub: p + ' %', ring: 'conic-gradient(#1F1D1A ' + p + '%, #DDD5C8 0)', bg: '#EBE5DA', fg: '#8A8378' });
    const cats = [
      { title: 'Splněné lekce', count: '3 / 7', lesson: true, tempo: false, train: false,
        items: mk([['První groove', 100], ['Stavitel groovu', 100], ['Veterán groovu', 100], ['Stovka groovů', 92], ['Dvě stě padesát', 37], ['Skoro všechno', 16], ['Každá lekce', 11]]) },
      { title: 'Cílové tempo', count: '4 / 7', lesson: false, tempo: true, train: false,
        items: mk([['Cílové tempo', 100], ['Desítka', 100], ['Čtvrtstovka v tempu', 100], ['Padesátka', 100], ['Stovka v tempu', 64], ['Dvě stě padesát v tempu', 25], ['Všechno v tempu', 9]]) },
      { title: 'Trénink', count: '0 / 3', lesson: false, tempo: false, train: true,
        items: mk([['Pravidelně', 57], ['Dlouhá paměť', 20], ['Upevněno', 4]]) }
    ];
    return { cats };
  }
}
</script>
</body>
</html>
