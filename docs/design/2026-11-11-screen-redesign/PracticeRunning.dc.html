<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Lekce běží</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;color:#1F1D1A}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{position:absolute;top:10px;width:46px;height:52px;border-radius:8px;background:#F4EFE6;display:flex;align-items:center;justify-content:center;font:700 17px 'IBM Plex Sans';color:#1F1D1A;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.chip.ok{background:#9C3C05;color:#F4EFE6;box-shadow:none}
.chip.bad{background:#1F1D1A;color:#F4EFE6;box-shadow:none}
.pc{width:40px;height:34px;border-radius:7px;background:#EBE5DA;border:1px solid rgba(31,29,26,.12);display:flex;align-items:center;justify-content:center;font:600 13px 'IBM Plex Sans';color:#5E5950}
.pc.u{border:2px solid #1F1D1A;color:#1F1D1A;background:#F4EFE6}
.pc.hit{background:#FF6B00;border:2px solid #1F1D1A;color:#1F1D1A}
.pass{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width:1194px;height:834px;background:#F4EFE6;position:relative;overflow:hidden">

  <div style="position:absolute;left:24px;top:30px;display:flex;align-items:baseline;gap:6px"><span style="font:700 34px/1 'IBM Plex Sans'">80</span><span style="font:600 14px 'IBM Plex Sans';letter-spacing:.08em;color:#5E5950">BPM</span></div>
  <div style="position:absolute;right:24px;top:86px;display:flex;align-items:center;gap:16px">
    <div aria-label="Načasování: mírně spěcháš" style="display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:#1F1D1A;color:#F4EFE6;font:600 14px 'IBM Plex Sans'">
      <div style="position:relative;width:64px;height:6px;border-radius:3px;background:rgba(244,239,230,.25)">
        <div style="position:absolute;left:31px;top:-4px;width:2px;height:14px;background:rgba(244,239,230,.5)"></div>
        <div style="position:absolute;left:40px;top:-3px;width:12px;height:12px;border-radius:50%;background:#FF6B00"></div>
      </div>
      <span>spěcháš</span>
    </div>
  </div>

  <div style="position:absolute;right:24px;top:22px;display:flex;align-items:center;gap:14px;height:52px;padding:0 8px 0 18px;border-radius:26px;background:#EBE5DA;border:1px solid rgba(31,29,26,.12)">
    <span style="font:600 15px 'IBM Plex Sans';color:#5E5950">Opakování</span>
    <div style="display:flex;gap:6px">
      <div class="pass" aria-label="Rozehrávka hotová" style="background:#1F1D1A;color:#F4EFE6"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div class="pass" aria-label="Rozehrávka hotová" style="background:#1F1D1A;color:#F4EFE6"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div style="width:1px;background:rgba(31,29,26,.25);margin:4px 2px"></div>
      <div class="pass" aria-label="Splněný průchod" style="background:#FF6B00;color:#1F1D1A"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px;stroke-width:3"><path d="M5 12l5 5 9-10"/></svg></div>
      <div class="pass" aria-label="Zbývá" style="border:2px dashed rgba(31,29,26,.35)"></div>
    </div>
    <div style="font:700 22px 'IBM Plex Sans';padding:0 10px">94 %</div>
  </div>

  <div aria-label="Průběh průchodu" style="position:absolute;left:24px;right:24px;top:472px;height:6px;border-radius:3px;background:#E0D8CA">
    <div style="position:absolute;left:0;top:0;bottom:0;width:44%;border-radius:3px;background:#1F1D1A"></div>
    <div style="position:absolute;left:25%;top:-3px;width:2px;height:12px;background:#F4EFE6"></div>
    <div style="position:absolute;left:50%;top:-3px;width:2px;height:12px;background:#B3ADA2"></div>
    <div style="position:absolute;left:75%;top:-3px;width:2px;height:12px;background:#B3ADA2"></div>
  </div>

  <div style="position:absolute;left:24px;top:132px;width:1146px;height:328px;background:#F07118;border-radius:4px">
    <div style="position:absolute;left:0;right:0;top:0;height:60px;background:#D45C0C"></div>
    <sc-for list="{{beats}}" as="bt" hint-placeholder-count="16">
      <div style="position:absolute;top:8px;left:{{bt.x}};width:40px;text-align:center;font:{{bt.font}};color:#1F1D1A">{{bt.label}}</div>
    </sc-for>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="position:absolute;left:0;right:0;top:{{r.y}};height:72px">
        <div style="position:absolute;left:24px;top:0;height:72px;display:flex;flex-direction:column;justify-content:center">
          <div style="font:700 26px/1 'IBM Plex Sans';color:#1F1D1A">{{r.name}}</div>
        </div>
        <div style="position:absolute;left:180px;right:16px;top:0;height:72px;background:rgba(255,255,255,.14);border-radius:6px">
          <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4">
            <div class="{{c.cls}}" style="left:{{c.x}}">{{r.abbr}}</div>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <div style="position:absolute;left:603px;top:60px;bottom:0;width:3px;background:#F4EFE6;box-shadow:0 0 0 1px #1F1D1A"></div>
  </div>

  <div style="position:absolute;left:24px;bottom:24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">
    <sc-for list="{{pads}}" as="p" hint-placeholder-count="16"><div class="{{p.cls}}">{{p.t}}</div></sc-for>
  </div>

  <div style="position:absolute;right:24px;bottom:24px;display:flex;flex-direction:column;gap:12px;width:200px">
    <button style="height:72px;border:0;border-radius:14px;background:#FF6B00;font:700 24px 'IBM Plex Sans';color:#1F1D1A;display:flex;align-items:center;justify-content:center;gap:10px"><span style="width:16px;height:16px;background:#1F1D1A;border-radius:2px"></span>Stop</button>
    <button style="height:64px;border:1.5px solid rgba(31,29,26,.28);border-radius:14px;background:#EBE5DA;font:600 20px 'IBM Plex Sans';color:#1F1D1A">Znovu</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const S = 59.4, L = 180, now = 7;
    const beats = [];
    for (let i = 0; i < 16; i++) {
      const big = i % 4 === 0;
      beats.push({ x: (L + i * S + 3) + 'px', label: big ? String(i / 4 + 1) : '·', font: big ? "700 36px/44px 'IBM Plex Sans'" : "700 22px/44px 'IBM Plex Sans'" });
    }
    const def = [
      { name: 'Ride', abbr: 'RD', steps: [0, 2, 4, 6, 8, 10, 12, 14] },
      { name: 'Snare', abbr: 'SN', steps: [4, 12] },
      { name: 'Kick', abbr: 'KD', steps: [0, 7, 8, 10] }
    ];
    const rows = def.map((r, i) => ({ name: r.name, abbr: r.abbr, y: (68 + i * 84) + 'px', cells: r.steps.map(s => ({ x: (s * S + 6) + 'px', cls: 'chip' + (s < now ? (r.abbr === 'RD' && s === 2 ? ' bad' : ' ok') : '') })) }));
    const names = ['TH','TL','CR','RD','SH','WD','CB','OH','HH','CP','RM','HH','KD','SN','SN','KD'];
    const pads = names.map((t, i) => ({ t, cls: 'pc' + (i === 12 ? ' hit' : (i === 3 || i === 13) ? ' u' : '') }));
    return { beats, rows, pads };
  }
}
</script>
</body>
</html>
